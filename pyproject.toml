[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vvspy"
version = "2.4.0"
description = "API Wrapper for VVS (Verkehrsverbund Stuttgart)"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zaanposni", email = "vvspy@zaanposni.com" }]
keywords = ["vvs", "api", "stuttgart", "wrapper", "json", "rest", "efa", "python"]
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zaanposni/vvspy"
Source = "https://github.com/zaanposni/vvspy"
Issues = "https://github.com/zaanposni/vvspy/issues"
Changelog = "https://github.com/zaanposni/vvspy/releases"

[dependency-groups]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["vvspy*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# generated by data/parser.py
exclude = ["vvspy/enums/stations.py"]

name: Release

# Publishing a GitHub release (with a tag like v2.4.0) builds the package
# and uploads it to PyPI via Trusted Publishing.
on:
    release:
        types: [published]

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    ci:
        uses: $/.github/workflows/ci.yml
        permissions:
            contents: read

    build:
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  # must match the Python version the pinned requirements were compiled with
                  python-version: "3.14"

            - name: Check tag matches package version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
                  if [ "$TAG" != "v$VERSION" ]; then
                      echo "::error::Release tag '$TAG' does not match package version 'v$VERSION' in pyproject.toml"
                      exit 1
                  fi

            - name: Install tools
              run: python -m pip install --require-hashes -r .github/requirements/release.txt

            - name: Build package
              run: |
                  SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
                  export SOURCE_DATE_EPOCH
                  python -m build

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: pypi
            url: https://pypi.org/project/vvspy/
        permissions:
            # required for PyPI Trusted Publishing and attestations
            id-token: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist/

            - name: Upload to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

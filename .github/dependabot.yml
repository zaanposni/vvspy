version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns: ["*"]

    # pinned tools used by the CI and release workflows
    - package-ecosystem: pip
      directory: /.github/requirements
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          ci-tools:
              patterns: ["*"]
